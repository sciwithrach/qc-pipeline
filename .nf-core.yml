repository_type: pipeline
nf_core_version: "4.1.0"
org_path: null
lint:
  files_exist: false
  files_unchanged: false
  actions_ci: false
  multiqc_config: false
  # No module emits versions.yml (this pipeline has no MultiQC/version-tracking
  # ecosystem, consistent with skip_features: multiqc above), so the nf-test
  # versions.yml-snapshot check can never pass here.
  nf_test_content:
    - tests/main.nf.test
template:
  name: utricleqc
  author: Rachel Honeyghan-Williams
  description: QC pipeline for mouse utricle single-cell data — cell calling, doublet detection, minimal filtering, dimensionality reduction, clustering and outlier removal.
  org: lipovsek-lab
  version: 1.0.0
  outdir: qc-pipeline-nfcore
  skip_features:
    - github
    - ci
    - multiqc
    - github_badges
    - igenomes
    - nf_schema
    - fastqc
